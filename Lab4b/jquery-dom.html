<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 4b - jQuery DOM</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #24324a;
            max-width: 720px;
            margin: 60px auto;
            padding: 24px
        }

        main {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px #172b4d16
        }

        button {
            background: #2563eb;
            color: white;
            border: 0;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer
        }

        input {
            padding: 11px;
            border: 1px solid #aaa;
            border-radius: 7px
        }

        p,
        li {
            line-height: 1.7
        }
    </style>
    <style>
        .myStyle {
            background-color: coral;
            padding: 16px;
            border-radius: 8px;
            margin: 16px 0
        }
    </style>
    <script defer src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script defer src="jquery-dom.js"></script>
</head>

<body>
    <main>
        <h1>Lab 4b - jQuery DOM</h1>
        <div id="myElement">Original Text</div>
        <div id="myDIV">
            <p>I am a myDIV.</p>
        </div><button id="myButton" type="button">Click me</button>
    </main>
</body>

</html>
